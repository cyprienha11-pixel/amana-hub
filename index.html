<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMANA HUB</title>

  <!-- Pi Network SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #4b217a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 30px 20px;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 38px;
      margin: 0;
      letter-spacing: 2px;
    }

    .tagline {
      margin-top: 12px;
      font-size: 18px;
    }

    .description {
      margin: 35px 0;
      font-size: 20px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #4b217a;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      font-size: 16px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🟣</div>

    <h1>AMANA HUB</h1>

    <div class="tagline">
      Connect • Trade • Earn
    </div>

    <div class="description">
      🌍 Your Digital Business Hub
    </div>

    <button id="piLoginButton" onclick="continueWithPi()">
      Continue with Pi
    </button>

    <div id="status" class="status"></div>

    <div class="footer">
      Secure • Simple • Connected
    </div>

  </div>

  <script>

    // Initialize Pi SDK
    Pi.init({
      version: "2.0",
      sandbox: true
    });

    async function continueWithPi() {

      const button = document.getElementById("piLoginButton");
      const status = document.getElementById("status");

      button.disabled = true;
      status.innerText = "Connecting to Pi...";

      try {

        const scopes = ["username", "payments"];

        const authResult = await Pi.authenticate(
          scopes,
          onIncompletePaymentFound
        );

        const accessToken = authResult.accessToken;
        const username = authResult.user.username;

        // Send access token to AMANA HUB backend
        const response = await fetch(
          "https://amana-hub.onrender.com/api/auth/verify",
          {
            method: "GET",
            headers: {
              "Authorization": "Bearer " + accessToken
            }
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Pi user verification failed"
          );
        }

        status.innerText =
          "Welcome, @" + username + " 🎉";

        button.innerText = "Pi Connected ✓";

        console.log("Pi user:", authResult.user);
        console.log("Backend verification:", data);

      } catch (error) {

        console.error(error);

        status.innerText =
          "Pi Login failed: " + error.message;

        button.disabled = false;
      }
    }

    // Handle incomplete Pi payment
    function onIncompletePaymentFound(payment) {

      console.log(
        "Incomplete payment found:",
        payment
      );

      if (
        payment &&
        payment.identifier &&
        payment.transaction &&
        payment.transaction.txid
      ) {

        fetch(
          "https://amana-hub.onrender.com/api/payments/complete",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              paymentId: payment.identifier,
              txid: payment.transaction.txid
            })
          }
        )
        .then(response => response.json())
        .then(data => {
          console.log(
            "Incomplete payment completed:",
            data
          );
        })
        .catch(error => {
          console.error(
            "Payment completion error:",
            error
          );
        });
      }
    }

  </script>

</body>
</html>
