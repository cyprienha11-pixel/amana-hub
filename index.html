<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMANA HUB</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #4b217a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 30px 20px;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 38px;
      margin: 0;
      letter-spacing: 2px;
    }

    .tagline {
      margin-top: 12px;
      font-size: 18px;
    }

    .description {
      margin: 30px 0;
      font-size: 20px;
      line-height: 1.5;
    }

    .payment-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      background: rgba(255,255,255,0.12);
    }

    .payment-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .payment-price {
      font-size: 18px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #4b217a;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 18px;
      font-size: 16px;
      line-height: 1.5;
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🟣</div>

    <h1>AMANA HUB</h1>

    <div class="tagline">
      Connect • Trade • Earn
    </div>

    <div class="description">
      🌍 Your Digital Business Hub
    </div>

    <button id="piLoginButton" onclick="continueWithPi()">
      Continue with Pi
    </button>

    <div id="paymentBox" class="payment-box" style="display:none;">

      <div class="payment-title">
        AMANA HUB Test Payment
      </div>

      <div class="payment-price">
        0.01 Test-Pi
      </div>

      <button id="payButton" onclick="makePayment()">
        Pay with Pi
      </button>

    </div>

    <div id="status" class="status"></div>

    <div class="footer">
      Secure • Simple • Connected
    </div>

  </div>

  <script>

    const Pi = window.Pi;

    let accessToken = null;
    let currentUsername = null;

    // Testnet / Sandbox
    Pi.init({
      version: "2.0",
      sandbox: true
    });


    // =========================
    // PI LOGIN
    // =========================

    async function continueWithPi() {

      const button = document.getElementById("piLoginButton");
      const status = document.getElementById("status");

      button.disabled = true;
      status.innerText = "Connecting to Pi...";

      try {

        const authResult = await Pi.authenticate(
          ["username", "payments"],
          onIncompletePaymentFound
        );

        accessToken = authResult.accessToken;
        currentUsername = authResult.user.username;

        const response = await fetch(
          "https://amana-hub.onrender.com/api/auth/verify",
          {
            method: "GET",
            headers: {
              "Authorization": "Bearer " + accessToken
            }
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "Pi user verification failed"
          );
        }

        status.innerText =
          "Welcome, @" + currentUsername + " 🎉";

        button.innerText = "Pi Connected ✓";

        button.disabled = true;

        document.getElementById("paymentBox").style.display =
          "block";

        console.log("Pi user:", authResult.user);
        console.log("Backend verification:", data);

      } catch (error) {

        console.error(error);

        status.innerText =
          "Pi Login failed: " + error.message;

        button.disabled = false;
      }
    }


    // =========================
    // PI PAYMENT
    // =========================

    function makePayment() {

      const status = document.getElementById("status");
      const payButton = document.getElementById("payButton");

      if (!accessToken) {
        status.innerText =
          "Please connect with Pi first.";
        return;
      }

      payButton.disabled = true;

      status.innerText =
        "Starting Pi payment...";

      const paymentData = {

        amount: 0.01,

        memo: "AMANA HUB Test Payment",

        metadata: {
          type: "test_payment",
          app: "AMANA HUB"
        }

      };


      Pi.createPayment(
        paymentData,

        {

          // =========================
          // SERVER APPROVAL
          // =========================

          onReadyForServerApproval: async (paymentId) => {

            console.log(
              "Payment ready for approval:",
              paymentId
            );

            try {

              const response = await fetch(
                "https://amana-hub.onrender.com/api/payments/approve",
                {
                  method: "POST",

                  headers: {
                    "Content-Type": "application/json",
                    "Authorization":
                      "Bearer " + accessToken
                  },

                  body: JSON.stringify({
                    paymentId: paymentId
                  })
                }
              );

              const data = await response.json();

              console.log(
                "Approval response:",
                data
              );

              if (!response.ok) {

                throw new Error(
                  data.error ||
                  "Payment approval failed"
                );

              }

            } catch (error) {

              console.error(
                "Approval error:",
                error
              );

              status.innerText =
                "Payment approval failed.";

              payButton.disabled = false;
            }
          },


          // =========================
          // SERVER COMPLETION
          // =========================

          onReadyForServerCompletion:
            async (paymentId, txid) => {

              console.log(
                "Payment ready for completion:",
                paymentId,
                txid
              );

              status.innerText =
                "Completing payment...";

              try {

                const response = await fetch(
                  "https://amana-hub.onrender.com/api/payments/complete",
                  {
                    method: "POST",

                    headers: {
                      "Content-Type":
                        "application/json",

                      "Authorization":
                        "Bearer " + accessToken
                    },

                    body: JSON.stringify({
                      paymentId: paymentId,
                      txid: txid
                    })
                  }
                );

                const data =
                  await response.json();

                console.log(
                  "Completion response:",
                  data
                );

                if (!response.ok) {

                  throw new Error(
                    data.error ||
                    "Payment completion failed"
                  );

                }

                status.innerText =
                  "Payment completed successfully! 🎉";

                payButton.innerText =
                  "Payment Complete ✓";

              } catch (error) {

                console.error(
                  "Completion error:",
                  error
                );

                status.innerText =
                  "Payment completion failed.";

                payButton.disabled = false;
              }
            },


          // =========================
          // CANCEL
          // =========================

          onCancel: (paymentId) => {

            console.log(
              "Payment cancelled:",
              paymentId
            );

            status.innerText =
              "Payment cancelled.";

            payButton.disabled = false;
          },


          // =========================
          // ERROR
          // =========================

          onError: (error, payment) => {

            console.error(
              "Pi payment error:",
              error,
              payment
            );

            status.innerText =
              "Payment error: " +
              error.message;

            payButton.disabled = false;
          }

        }
      );
    }


    // =========================
    // INCOMPLETE PAYMENT
    // =========================

    function onIncompletePaymentFound(payment) {

      console.log(
        "Incomplete payment found:",
        payment
      );

      if (
        payment &&
        payment.identifier &&
        payment.transaction &&
        payment.transaction.txid
      ) {

        fetch(
          "https://amana-hub.onrender.com/api/payments/complete",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Authorization":
                "Bearer " + accessToken
            },

            body: JSON.stringify({

              paymentId:
                payment.identifier,

              txid:
                payment.transaction.txid

            })
          }
        )
        .then(response =>
          response.json()
        )
        .then(data => {

          console.log(
            "Incomplete payment completed:",
            data
          );

        })
        .catch(error => {

          console.error(
            "Incomplete payment error:",
            error
          );

        });
      }
    }

  </script>

</body>
</html>
