<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMANA HUB</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #4b217a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 450px;
      padding: 30px 20px;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 38px;
      margin: 0;
      letter-spacing: 2px;
    }

    .tagline {
      margin-top: 12px;
      font-size: 18px;
    }

    .description {
      margin: 35px 0;
      font-size: 20px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: white;
      color: #4b217a;
    }

    button:active {
      transform: scale(0.98);
    }

    .footer {
      margin-top: 30px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">🟣</div>

    <h1>AMANA HUB</h1>

    <div class="tagline">
      Connect • Trade • Earn
    </div>

    <div class="description">
      🌍 Your Digital Business Hub
    </div>

    <button onclick="continueWithPi()">
      Continue with Pi
    </button>

    <div class="footer">
      Secure • Simple • Connected
    </div>

  </div>

  <script>
    function continueWithPi() {
      alert("AMANA HUB Pi Login will be connected soon!");
    }
  </script>

</body>
</html>
